name: Publish release 3.0.0

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'publish GitHub release 3.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: 3.0.0

      - name: Build release archive
        run: composer archive --format=zip --dir=/tmp --file=websk-php-db-3.0.0

      - name: Write release notes
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          PHP 8.5 compatibility release with updated test and static-analysis tooling.

          ### Added

          - Verified support for PHP 8.5, including PHP 8.5.11.
          - PHPUnit 12.5 test suite and PHPStan 2 analysis at level 8.
          - MIT license and Composer validation scripts.

          ### Changed

          - PSR-4 mapping now uses `WebSK\` => `src/WebSK/`.
          - PDO ownership in `DB` is non-nullable.
          - Migration files use one SQL statement per non-empty line.
          - CLI database configuration is validated and normalized.

          ### Breaking changes

          - `DB::getPdoObj()` and `DB::setPdoObj()` no longer accept or return `null`.
          - CLI database configuration requires string `host`, `db_name`, `user`, and `password` values.
          - `MigrationService::addMigrationQuery()` writes line-delimited SQL instead of PHP array syntax.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 3.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "3.0.0" \
            --notes-file /tmp/release-notes.md \
            "/tmp/websk-php-db-3.0.0.zip#websk-php-db-3.0.0.zip"
